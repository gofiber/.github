version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    labels:
      - "🤖 Dependencies"
    # sibling PRs left behind on a shared workflow file can't be merged by GITHUB_TOKEN
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
