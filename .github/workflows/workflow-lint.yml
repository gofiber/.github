name: workflow-lint

# Reusable actionlint runner for the GitHub Actions workflows of a repo.
# Callers need a .github/actionlint.yaml declaring the blacksmith runner labels,
# otherwise every `runs-on: blacksmith-*` is reported as an unknown label.

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: 'actionlint version to use.'
        required: false
        type: string
        default: '1.7.12'
      flags:
        description: 'Additional flags for actionlint (e.g. "-ignore <regex>").'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: ${{ inputs.actionlint-version }}
          flags: ${{ inputs.flags }}

      # An alternative that matches no job silently drops that job from dependabot's merge gate.
      - name: Check the automerge gate against real job names
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, os, re, sys, yaml

          WF = '.github/workflows'
          DEFAULT = '^test|^discover|^go|^workflows /|^scripts'  # keep in sync with dependabot-automerge.yml

          def load(path):
              try:
                  doc = yaml.safe_load(open(path, encoding='utf-8'))
                  return doc if isinstance(doc, dict) else {}
              except Exception:
                  return {}

          pattern, required, found = None, '', False
          for name in ('dependabot-automerge.yml', 'dependabot_automerge.yml'):
              path = os.path.join(WF, name)
              if os.path.exists(path):
                  found = True
                  for job in (load(path).get('jobs') or {}).values():
                      if isinstance(job, dict) and 'automerge' in str(job.get('uses', '')):
                          inputs = job.get('with') or {}
                          pattern = inputs.get('match_pattern') or DEFAULT
                          required = inputs.get('required_checks') or ''
                  pattern = pattern or DEFAULT
          if not found:
              print('no dependabot automerge workflow, nothing to check')
              sys.exit(0)

          # A check run is named after the job's `name:`, or its key, and a job that
          # calls a reusable workflow is prefixed onto the callee's own job name.
          names, jobs = set(), {}
          for f in sorted(glob.glob(f'{WF}/*.yml') + glob.glob(f'{WF}/*.yaml')):
              for key, job in (load(f).get('jobs') or {}).items():
                  if not isinstance(job, dict):
                      continue
                  names.update({str(key), str(job.get('name') or key)})
                  if job.get('uses'):
                      names.add(f'{key} / ')
                  jobs[(f, str(key))] = job

          def dead(alternatives):
              return [a for a in alternatives.split('|') if not any(re.search(a, n) for n in names)]

          errors = []
          if dead(pattern):
              errors.append(f'match_pattern {pattern!r} has alternatives that match no job '
                            f'in this repo: {dead(pattern)}. Dependabot would merge without waiting for them.')

          # same parsing as the wait job: "<package-ecosystem>: <alternatives>" per line
          lines = dict(re.match(r'([^:]*): *(.*)', l).groups() for l in required.splitlines() if ':' in l)
          ecosystems = {str(u.get('package-ecosystem')) for u in load('.github/dependabot.yml').get('updates') or []}
          for eco, checks in lines.items():
              if eco not in ecosystems:
                  errors.append(f'required_checks has a line for {eco!r}, which .github/dependabot.yml does not update')
              if dead(checks):
                  errors.append(f'required_checks for {eco} has alternatives that match no job: {dead(checks)}. '
                                f'Its updates would never merge.')
          for eco in sorted(ecosystems - set(lines)) if required else []:
              print(f'::warning::required_checks has no line for {eco}, so its updates are not auto-merged')

          # The wait job settles once no gated run is pending, which is too early when a
          # gated job only starts after an ungated one it needs.
          gate = '|'.join([pattern, *lines.values()])
          gated = lambda key, job: bool(re.search(gate, str(job.get('name') or key)) or re.search(gate, key))
          for (f, key), job in jobs.items():
              needs = job.get('needs') or []
              for parent in [needs] if isinstance(needs, str) else needs:
                  if gated(key, job) and (f, parent) in jobs and not gated(parent, jobs[(f, parent)]):
                      errors.append(f'{f}: gated job {key!r} needs {parent!r}, which is not gated')

          for e in errors:
              print(f'::error::{e}')
          if errors:
              sys.exit(1)
          print(f'match_pattern {pattern!r} and required_checks: every alternative matches a job')
          PY
