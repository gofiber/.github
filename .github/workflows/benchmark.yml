name: benchmark

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version passed to actions/setup-go
        required: false
        default: 1.25.x
        type: string
      runs-on:
        description: >-
          Runner label for the benchmark job. Defaults to the Blacksmith arm64 pool: the x64 pool
          hands out AMD EPYC and Intel Xeon under one label and moves the same benchmark by up to
          2x between them, which costs more comparisons than the faster x64 cores are worth. Use a
          non-arm label where the benchmarks need x64, and expect the baseline to start over, the
          cache key carries the CPU.
        required: false
        default: blacksmith-4vcpu-ubuntu-2404-arm
        type: string
      multi-module:
        description: Run the benchmarks of every top-level directory that contains a go.mod (multi-module repos)
        required: false
        default: false
        type: boolean
      working-directory:
        description: Directory to run the benchmarks in (single-module mode)
        required: false
        default: '.'
        type: string
      benchmark-data-dir-path:
        description: Directory on the gh-pages branch where the benchmark data is stored
        required: false
        default: benchmarks
        type: string
      max-items-in-chart:
        description: >-
          Number of runs kept in the gh-pages data.js. Pick roughly the amount of
          default-branch pushes in 3 months; this also keeps the file well below
          GitHub's 100 MB per-file push limit (the action never prunes by default).
        required: true
        type: number
      alert-threshold:
        description: Regression threshold at which an alert is raised
        required: false
        default: 150%
        type: string
      improve-threshold:
        description: >-
          Improvement from which a result is reported back in the PR comment. Empty mirrors
          alert-threshold: below the level at which a regression would be believed, an
          "improvement" is just the runner-to-runner noise pointing the other way.
        required: false
        default: ''
        type: string
      filter-parallel:
        description: Drop results whose benchmark name contains Parallel before processing
        required: false
        default: false
        type: boolean
      go-force-package-suffix:
        description: Always append the Go package to the benchmark names (keep whatever format the existing chart history uses)
        required: false
        default: false
        type: boolean
      alert-min-ns:
        description: >-
          Drop benchmarks faster than this many ns/op from the alert comparison. Sub-nanosecond
          results measure loop overhead and code alignment and flip between runners. 0 keeps all.
        required: false
        default: 1
        type: number
      pages-cpu-model:
        description: >-
          Publish to gh-pages only when the runner CPU contains this string (case-insensitive).
          Empty publishes from every runner, which is what the arm64 default wants: pinning a
          model that the pool later stops handing out would silently skip every publish. Pin it
          only if the chart turns out to mix models. PR comparison is unaffected either way, its
          baseline cache is keyed by hardware and a mixed run simply finds no baseline.
        required: false
        default: ''
        type: string
      go-test-flags:
        description: Extra flags passed to go test
        required: false
        default: ''
        type: string
      setup-script:
        description: Repo-local script run before the benchmarks; receives the working directory as $1 and may append to $GITHUB_ENV
        required: false
        default: ''
        type: string
      sync-pages:
        description: Sync the shared benchmark page to gh-pages after publishing (disable in matrix legs and sync once afterwards)
        required: false
        default: true
        type: boolean
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 30
        type: number
      shards:
        description: >-
          Run the benchmarks in this many parallel jobs and merge their output before
          anything is compared or published. Downstream sees one combined result file,
          so the split is invisible to github-action-benchmark and to the charts.
          1 keeps everything in a single job. Not supported with multi-module.
        required: false
        default: 1
        type: number

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write
  # allow posting comments to pull request
  pull-requests: write

jobs:
  # A matrix needs a literal list and expressions have no range(), so the shard
  # indices are generated here. Skipped entirely for an unsharded run.
  plan:
    if: inputs.shards > 1
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - name: Generate shard indices
        id: gen
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          if [[ "${SHARDS}" -gt 64 ]]; then
            echo "shards=${SHARDS} is beyond anything sensible; cap it in the caller" >&2
            exit 1
          fi
          list="$(seq 0 $((SHARDS - 1)) | jq -sRc 'split("\n") | map(select(length > 0) | tonumber)')"
          echo "shards=${list}" >> "$GITHUB_OUTPUT"
          echo "Sharding across ${SHARDS} jobs: ${list}" >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    needs: plan
    # plan is skipped for an unsharded run, which would cascade to this job
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        # falls back to a single nameless leg when plan did not run
        shard: ${{ fromJson(needs.plan.outputs.shards || '[0]') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Reject unsupported combination
        if: ${{ inputs.multi-module && inputs.shards > 1 }}
        shell: bash
        run: |
          echo "::error::shards > 1 is not supported together with multi-module" >&2
          exit 1

      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout central scripts
        if: inputs.shards > 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gofiber/.github
          path: .central

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          # resolve the newest matching patch instead of whatever the runner image
          # happens to cache; a module's go directive can outrun it (see mssql)
          check-latest: true
          # per-module cache key for matrix legs; all modules for the loop mode
          cache-dependency-path: ${{ inputs.multi-module && '**/go.sum' || format('{0}/go.sum', inputs.working-directory) }}

      # Everything the baseline depends on is decided here and nowhere else: both the
      # sharded and the single-job path read BENCHMARK_CPU back out of the environment.
      - name: Describe benchmark hardware
        shell: bash
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        run: |
          set -euo pipefail
          # Blacksmith hands out a larger runner than the label promises whenever it has
          # spare capacity, which moves GOMAXPROCS and every benchmark number with it
          if [[ "$RUNS_ON" =~ -([0-9]+)vcpu- ]]; then
            procs="${BASH_REMATCH[1]}"
            echo "GOMAXPROCS=${procs}" >> "$GITHUB_ENV"
          else
            procs="$(nproc)"
          fi
          model="$(lscpu | awk -F': *' '/^Model name/ && !m { m = $2 } END { print m }')"
          # arm64 carries no model name in /proc/cpuinfo and lscpu only decodes the part
          # ids it ships a table for, so identify the core by its raw ids instead
          if [[ -z "$model" ]]; then
            model="$(uname -m) $(awk -F': *' '/^CPU implementer|^CPU part/ { print $2 }' \
              /proc/cpuinfo | sort -u | tr '\n' ' ')"
          fi
          model="$(printf '%s' "$model" | sed 's/ *$//')"
          echo "BENCHMARK_CPU=${model} (GOMAXPROCS=${procs})" >> "$GITHUB_ENV"
          echo "Benchmark hardware: ${model} (GOMAXPROCS=${procs}, runner offers $(nproc))" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run Setup Script
        if: inputs.setup-script != ''
        shell: bash
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash "$SETUP_SCRIPT" "$WORKING_DIRECTORY"

      - name: Run Benchmarks (multi-module)
        if: inputs.multi-module
        shell: bash
        env:
          GO_TEST_FLAGS: ${{ inputs.go-test-flags }}
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/output.txt"
          for d in */ ; do
            if [[ ! -f "${d}go.mod" ]]; then
              continue
            fi
            (
              cd "$d"
              # shellcheck disable=SC2086 # GO_TEST_FLAGS is intentionally word-split
              go test ./... -benchmem -run=^$ -bench . $GO_TEST_FLAGS
            ) | tee -a "$GITHUB_WORKSPACE/output.txt"
          done

      - name: Run Benchmarks
        if: ${{ !inputs.multi-module && inputs.shards <= 1 }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          GO_TEST_FLAGS: ${{ inputs.go-test-flags }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # GO_TEST_FLAGS is intentionally word-split
          go test ./... -benchmem -run=^$ -bench . $GO_TEST_FLAGS | tee "$GITHUB_WORKSPACE/output.txt"

      # One `go test` per package rather than a single run over ./...: benchmark names
      # are not unique across packages, so a shard's combined regex would match the
      # same name in a package that belongs to a different shard and measure it twice.
      - name: Run Benchmarks (shard)
        if: ${{ !inputs.multi-module && inputs.shards > 1 }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          GO_TEST_FLAGS: ${{ inputs.go-test-flags }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          go test -list '^Benchmark' ./... > bench-list.txt
          python3 "$GITHUB_WORKSPACE/.central/.github/scripts/shard_benchmarks.py" \
            < bench-list.txt > bench-plan.txt
          : > "$GITHUB_WORKSPACE/output.txt"
          while read -r pkg pattern; do
            [ -n "$pkg" ] || continue
            # shellcheck disable=SC2086 # GO_TEST_FLAGS is intentionally word-split
            go test -benchmem -run=^$ -bench "$pattern" $GO_TEST_FLAGS "$pkg" \
              | tee -a "$GITHUB_WORKSPACE/output.txt"
          done < bench-plan.txt

      - name: Record shard result
        if: inputs.shards > 1
        id: shard-result
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          # the reporting job never touches a benchmark runner, so it is told which
          # hardware produced the numbers instead of reading its own
          printf '%s\n' "$BENCHMARK_CPU" > cpu.txt
          SLUG="$(printf '%s' "$WORKING_DIRECTORY" | tr -cs '[:alnum:]._-' '-')"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Upload shard output
        if: inputs.shards > 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ steps.shard-result.outputs.slug }}-shard-${{ matrix.shard }}
          path: |
            output.txt
            cpu.txt
          retention-days: 1
          if-no-files-found: error

      - name: Report Results
        if: inputs.shards <= 1
        uses: gofiber/.github/.github/actions/benchmark-report@main
        with:
          cpu-model: ${{ env.BENCHMARK_CPU }}
          filter-parallel: ${{ inputs.filter-parallel }}
          alert-min-ns: ${{ inputs.alert-min-ns }}
          alert-threshold: ${{ inputs.alert-threshold }}
          improve-threshold: ${{ inputs.improve-threshold }}
          go-force-package-suffix: ${{ inputs.go-force-package-suffix }}
          max-items-in-chart: ${{ inputs.max-items-in-chart }}
          benchmark-data-dir-path: ${{ inputs.benchmark-data-dir-path }}
          pages-cpu-model: ${{ inputs.pages-cpu-model }}
          working-directory: ${{ inputs.working-directory }}
          sync-pages: ${{ inputs.sync-pages }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Merges the shards back into a single output file, so everything downstream runs
  # against exactly what an unsharded run would have produced.
  report:
    if: ${{ inputs.shards > 1 && !cancelled() && !failure() }}
    needs: benchmark
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # When the comparison flags regressions, benchmark-report re-measures exactly
      # those benchmarks to weed out one-off runner noise, and that needs a toolchain
      # this job otherwise would not have.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          # sharding is single-module only, so the module sits in working-directory
          cache-dependency-path: ${{ format('{0}/go.sum', inputs.working-directory) }}

      - name: Build artifact prefix
        id: prefix
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          SLUG="$(printf '%s' "$WORKING_DIRECTORY" | tr -cs '[:alnum:]._-' '-')"
          echo "value=benchmark-${SLUG}-shard-" >> "$GITHUB_OUTPUT"

      - name: Download shard outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ steps.prefix.outputs.value }}*
          path: shards

      - name: Merge shard outputs
        id: merge
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          found=$(find shards -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [[ "${found}" -ne "${SHARDS}" ]]; then
            echo "::error::expected ${SHARDS} shard artifacts, found ${found}" >&2
            exit 1
          fi
          # sorted so the merged file is reproducible run to run
          find shards -name output.txt | sort | xargs cat > output.txt
          if [[ ! -s output.txt ]]; then
            echo "::error::merged benchmark output is empty" >&2
            exit 1
          fi
          echo "Merged ${found} shards, $(grep -c '^Benchmark' output.txt) benchmark results" \
            >> "$GITHUB_STEP_SUMMARY"
          # all shards should sit on identical hardware; if they do not, the numbers in
          # this one data point come from different machines and that must be visible
          mapfile -t models < <(find shards -name cpu.txt | sort | xargs cat | sort -u)
          if [[ "${#models[@]}" -gt 1 ]]; then
            echo "::warning::shards ran on different hardware: ${models[*]}"
            echo "Shards ran on different hardware: ${models[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi
          # every model goes into the key, so a mixed run cannot borrow the baseline of
          # whichever model happens to sort first and report the difference as a regression
          echo "cpu=$(IFS=+; printf '%s' "${models[*]}")" >> "$GITHUB_OUTPUT"

      - name: Report Results
        uses: gofiber/.github/.github/actions/benchmark-report@main
        with:
          cpu-model: ${{ steps.merge.outputs.cpu }}
          filter-parallel: ${{ inputs.filter-parallel }}
          alert-min-ns: ${{ inputs.alert-min-ns }}
          alert-threshold: ${{ inputs.alert-threshold }}
          improve-threshold: ${{ inputs.improve-threshold }}
          go-force-package-suffix: ${{ inputs.go-force-package-suffix }}
          max-items-in-chart: ${{ inputs.max-items-in-chart }}
          benchmark-data-dir-path: ${{ inputs.benchmark-data-dir-path }}
          pages-cpu-model: ${{ inputs.pages-cpu-model }}
          working-directory: ${{ inputs.working-directory }}
          sync-pages: ${{ inputs.sync-pages }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
