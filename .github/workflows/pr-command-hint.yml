name: pr-command-hint

# Appends one small line to the description of a newly opened pull request naming
# the slash commands pr-command.yml offers there. pull_request_target, so it can
# edit forks' pull requests as well: it checks out nothing and handles the
# description only as data, so the write token never runs pull request content.

on:
  workflow_call:
    inputs:
      hint:
        description: 'One line on what the commands do, e.g. "`/generate` re-runs the code generators on this branch".'
        required: true
        type: string

permissions:
  contents: read

jobs:
  hint:
    # Bots open dependency bumps, which none of the commands are for.
    if: >-
      github.event.pull_request
      && github.event.action == 'opened'
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Append to the description
        id: append
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HINT: ${{ inputs.hint }}
        run: |
          set -euo pipefail
          marker='<!-- pr-command-hint -->'

          # Fetched now, not taken from the event: the author may have edited the
          # description since opening, and writing back that copy would undo it.
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')
          case "$body" in *"$marker"*) exit 0 ;; esac

          printf '%s\n\n%s\n<sub>🤖 Maintainers: %s</sub>\n' "$body" "$marker" "$HINT" > "$RUNNER_TEMP/body.md"
          gh pr edit "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
