name: test-actions

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/test-actions.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # these had no runner until now, so they only ever ran on someone's laptop
  scripts:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run script self-checks
        run: |
          set -euo pipefail
          bash .github/scripts/test/test-benchmark-cpu-key.sh
          bash .github/scripts/test/test-benchmark-comment.sh
          bash .github/scripts/test/test-benchmark-pages.sh
          python3 .github/scripts/test/test_benchmark_compare.py
          python3 .github/scripts/test/test_benchmark_publish.py
          python3 .github/scripts/test/test_shard_benchmarks.py

  discover:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      go-modules: ${{ steps.go.outputs.modules }}
      has-go: ${{ steps.go.outputs.has-modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover Go modules with tests
        id: go
        shell: bash
        run: |
          set -euo pipefail
          json=$(
            find .github/actions -name go.mod -type f -exec dirname {} \; \
              | sort -u \
              | while read -r dir; do
                  if find "$dir" -name '*_test.go' -print -quit | grep -q .; then
                    echo "$dir"
                  fi
                done \
              | jq -Rcn '[inputs]'
          )
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          if [ "$json" = "[]" ]; then
            echo "has-modules=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-modules=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Discovered: $json"

  go:
    needs: discover
    if: needs.discover.outputs.has-go == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.go-modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1 -shuffle=on
