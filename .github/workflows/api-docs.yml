name: api-docs

# Reusable drift check for Markdown blocks generated by genapidocs
# (.github/actions/api-docs). Pins one build context, because go/printer output
# and file selection vary across toolchains and platforms.

on:
  workflow_call:
    inputs:
      packages:
        description: Package pattern passed to `go generate`.
        required: false
        type: string
        default: ./...
      docs:
        description: Path checked for drift after generating.
        required: false
        type: string
        default: docs
      go-version-file:
        description: File that pins the Go version used to generate.
        required: false
        type: string
        default: go.mod

permissions:
  contents: read

jobs:
  api-docs:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: gofiber/.github/.github/actions/api-docs@main
        with:
          packages: ${{ inputs.packages }}
          docs: ${{ inputs.docs }}
