name: Dependabot auto-merge

on:
  workflow_dispatch:
  pull_request_target:
  workflow_call:
    inputs:
      match_pattern:
        description: Regex of check run names that must all succeed or be skipped before merging. Anchor it, so a pull_request_target job cannot stand in for late CI.
        required: false
        default: '^test|^discover|^go|^workflows /|^scripts'
        type: string
      required_checks:
        description: 'One line per dependabot package-ecosystem, e.g. "gomod: ^unit|^lint /". Each alternative must start within 10 minutes and pass, and an ecosystem without a line is not merged. Empty means any one match_pattern check will do.'
        required: false
        default: ''
        type: string
      wait-delay:
        description: Seconds to wait before the first poll, giving triggered checks time to register their check runs.
        required: false
        default: 60
        type: number
    secrets:
      github-token:
        description: Token with `pull_requests:write` and `contents:write` permissions
        required: false

permissions:
  contents: write
  pull-requests: write

# a rebase supersedes the previous run, which would otherwise keep polling a dead head
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait_for_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The PR author, not the actor: a repo that rebuilds a committed artefact on
    # the branch (multi-labeler rebuilds dist/) pushes with a PAT, which makes
    # its owner the actor of the follow-up run and left the merge job skipped on
    # a green PR. Foreign commits are rejected in the job below instead.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      # Every matching run counts on its own: poseidon/wait-for-status-checks kept one run
      # per name (a red module merged in contrib#2686) and passed on none (fiber#4872).
      - name: Wait for the gated checks
        env:
          GH_TOKEN: ${{ secrets.github-token != '' && secrets.github-token || github.token }}
          CHECK_RUNS: repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs?per_page=100
          MATCH_PATTERN: ${{ inputs.match_pattern != '' && inputs.match_pattern || '^test|^discover|^go|^workflows /|^scripts' }}
          # this repository runs the workflow directly, without inputs
          REQUIRED_CHECKS: "${{ inputs.required_checks || (github.repository == 'gofiber/.github' && 'github-actions: ^workflows /|^scripts|^discover|^go') || '' }}"
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DELAY: ${{ inputs.wait-delay || 60 }}
        run: |
          # dependabot/<package manager>/..., named as in dependabot.yml
          eco=$(cut -d/ -f2 <<<"$HEAD_REF" | sed 's/^go_modules$/gomod/; s/^npm_and_yarn$/npm/; s/_/-/g')
          if [ -n "$REQUIRED_CHECKS" ]; then
            required=$(awk -F': *' -v eco="$eco" '$1 == eco { sub(/^[^:]*: */, ""); print }' <<<"$REQUIRED_CHECKS")
            if [ -z "$required" ]; then
              echo "::error ::required_checks names no checks for $eco updates, refusing to auto-merge"
              exit 1
            fi
            IFS='|' read -ra expected <<<"$required"
          else
            required=$MATCH_PATTERN
            expected=("$MATCH_PATTERN")
          fi
          export GATE="$MATCH_PATTERN|$required"

          sleep "$DELAY"
          settled=0
          for poll in $(seq 50); do
            if [ "$poll" -gt 1 ]; then
              sleep 30
            fi
            runs=$(gh api --paginate "$CHECK_RUNS" --jq '.check_runs[]
              | select((.name | test(env.GATE)) and (.name | endswith("wait_for_checks") | not))
              | (if .status != "completed" then "pending"
                 elif .conclusion == "success" or .conclusion == "skipped" then "ok"
                 else "failed (\(.conclusion))" end) + "\t" + .name') || continue
            if grep '^failed' <<<"$runs"; then
              echo "::error ::a gated check failed, refusing to auto-merge"
              exit 1
            fi
            missing=()
            for check in "${expected[@]}"; do
              cut -f2 <<<"$runs" | grep -qE -- "$check" || missing+=("$check")
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              settled=0
              if [ "$poll" -lt 20 ]; then
                continue
              fi
              echo "::error ::no check matching $(IFS=,; echo "${missing[*]}") started within 10 minutes, refusing to auto-merge"
              exit 1
            fi
            # a second settled poll also catches jobs that only start once their `needs:` finished
            if grep -q '^pending' <<<"$runs"; then
              settled=0
            else
              settled=$((settled + 1))
            fi
            if [ "$settled" -ge 2 ]; then
              exit 0
            fi
          done
          echo "::error ::gated checks did not finish within 25 minutes, refusing to auto-merge"
          exit 1
  dependabot:
    needs: [wait_for_checks]
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The PR author, not the actor: a repo that rebuilds a committed artefact on
    # the branch (multi-labeler rebuilds dist/) pushes with a PAT, which makes
    # its owner the actor of the follow-up run and left the merge job skipped on
    # a green PR. Foreign commits are rejected in the job below instead.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      # Gating on the PR author alone would let anyone with push access land a
      # commit on a dependabot branch and have it merged without review. Only
      # dependabot's own commits and CI's artefact rebuild may ride along, and
      # the commit author is what distinguishes them: the push happens with a
      # PAT, so the actor is useless here.
      - name: Reject foreign commits
        env:
          GITHUB_TOKEN: ${{ secrets.github-token != '' && secrets.github-token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          foreign=$(gh pr view "$PR_URL" --json commits \
            --jq '[.commits[].authors[].login // "unknown"]
                  | map(select(. != "dependabot[bot]" and . != "github-actions[bot]"))
                  | unique | join(", ")')
          [ -z "$foreign" ] || {
            echo "::error ::pull request carries commits from ${foreign}, refusing to auto-merge"
            exit 1
          }

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.github-token != '' && secrets.github-token || github.token }}
      # github_actions majors automerge too, except glue actions whose outputs feed other
      # jobs, and never in .github itself: its reusables never run in its own PR CI, and
      # every repo pins them @main, so a bad merge breaks the org at once.
      - name: Enable auto-merge for Dependabot PRs
        if: >-
          ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
              steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
              (steps.metadata.outputs.update-type == 'version-update:semver-major' &&
               steps.metadata.outputs.package-ecosystem == 'github_actions' &&
               github.repository != 'gofiber/.github' &&
               !contains(steps.metadata.outputs.dependency-names, 'dorny/paths-filter') &&
               !contains(steps.metadata.outputs.dependency-names, 'dependabot/fetch-metadata') &&
               !contains(steps.metadata.outputs.dependency-names, 'release-drafter/release-drafter')) }}
        run: |
          gh pr review --approve "$PR_URL"
          # retries absorb a check landing after the merge attempt (unstable status) and a
          # concurrent merge moving the base; measured stragglers ran 106s and 179s late.
          # No --auto: an armed auto-merge took the next, untested head (contrib#2680).
          n=0
          until gh pr merge --merge --match-head-commit "$HEAD_SHA" "$PR_URL"; do
            n=$((n + 1))
            [ "$n" -ge 10 ] && exit 1
            echo "merge failed ($n/10), retrying in 30s..."
            sleep 30
          done
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.github-token != '' && secrets.github-token || github.token }}
