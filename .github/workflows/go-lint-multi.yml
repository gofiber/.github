name: Linter (multi-module)

# Reusable, centrally hosted linter for multi-module GoFiber repos
# (contrib, storage, template).
#
# On push to main/master or workflow_dispatch: lints ALL modules.
# On pull_request: lints only modules whose files changed.
# Modules are auto-discovered by locating go.mod files under module-dir.

on:
  workflow_call:
    inputs:
      module-dir:
        description: >-
          Root directory for multi-module discovery (e.g. "v3", ".").
        required: false
        type: string
        default: '.'
      golangci-lint-version:
        description: 'golangci-lint version to use.'
        required: false
        type: string
        default: 'v2.6.2'
      golangci-lint-args:
        description: 'Additional args for golangci-lint (e.g. "--tests=false --timeout=5m").'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      # Shallow is enough: paths-filter reads the PR file list from the REST API and
      # fetches just the push base commit when it diffs one
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover modules
        id: discover
        env:
          MODULE_DIR: ${{ inputs.module-dir }}
        shell: bash
        run: |
          set -euo pipefail

          # Find all go.mod files under MODULE_DIR (skip vendor/testdata)
          if [ "$MODULE_DIR" = "." ]; then
            modules=$(find . -name go.mod -not -path ./go.mod \
              -not -path '*/vendor/*' -not -path '*/testdata/*' \
              | sed 's|/go.mod||; s|^\./||' | sort)
          else
            modules=$(find "$MODULE_DIR" -name go.mod \
              -not -path '*/vendor/*' -not -path '*/testdata/*' \
              | sed 's|/go.mod||; s|^\./||' | sort)
          fi

          if [ -z "$modules" ]; then
            echo "::warning::No Go modules found under ${MODULE_DIR}"
            echo "filters=" >> "$GITHUB_OUTPUT"
            echo "all=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build dorny/paths-filter YAML
          # _shared fans out to every module, so it lists only files that can change
          # any module's lint result: the config, the workspace, and the calling
          # workflow (golangci-lint version/args live there). A root README must not.
          prefix=""
          [ "$MODULE_DIR" = "." ] || prefix="${MODULE_DIR}/"
          caller="${GITHUB_WORKFLOW_REF:-}"; caller="${caller%%@*}"
          {
            echo "filters<<EOF"
            for mod in $modules; do
              echo "${mod}: \"${mod}/**\""
            done
            echo "_shared:"
            for f in .golangci.yml .golangci.yaml go.work go.work.sum; do
              echo "  - \"${prefix}${f}\""
            done
            echo "  - \"${caller#*/*/}\""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Build JSON array of all module paths
          all=$(printf '%s\n' $modules | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "all=${all}" >> "$GITHUB_OUTPUT"

      # PRs use the REST file list, pushes diff against github.event.before - the
      # shallow checkout still works, paths-filter fetches that commit on its own.
      - name: Filter changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: ${{ steps.discover.outputs.filters }}

      - name: Set packages
        id: set-packages
        shell: bash
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          ALL: ${{ steps.discover.outputs.all }}
        run: |
          # No filter ran (workflow_dispatch/schedule) or a shared file changed → all
          # modules; PR and push → only the modules the diff touched.
          if [ -z "$CHANGES" ] || printf '%s' "$CHANGES" | jq -e 'index("_shared")' > /dev/null 2>&1; then
            packages="$ALL"
          else
            packages="$CHANGES"
          fi
          [ -z "$packages" ] && packages="[]"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  lint:
    if: needs.changes.outputs.packages != '[]'
    name: "lint (${{ matrix.package }})"
    needs: changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "${{ matrix.package }}/go.mod"
          cache-dependency-path: ${{ matrix.package }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOWORK: 'off'
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: ${{ inputs.golangci-lint-args }}
          working-directory: ${{ matrix.package }}
          install-mode: goinstall
