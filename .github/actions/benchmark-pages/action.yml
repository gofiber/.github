name: benchmark-pages
description: >-
  Publish a benchmark run into the gh-pages data (columnar v2 data.js, legacy
  files are converted on first contact) and sync the shared benchmark page, the
  root redirect and (for multi-folder layouts) folders.json plus per-package
  redirect stubs to the gh-pages branch. One commit, one push.

inputs:
  data-dir:
    description: Directory on the gh-pages branch that holds the benchmark data
    required: false
    default: benchmarks
  output-file:
    description: >-
      Raw `go test -bench` output to append to the benchmark data. Empty skips
      the data publish and only syncs the page.
    required: false
    default: ''
  max-items:
    description: Number of runs kept in the benchmark data; required to publish
    required: false
    default: ''
  go-force-package-suffix:
    description: Always append the Go package to the series names
    required: false
    default: 'false'
  cpu-model:
    description: CPU the run measured on, stored per run so chart jumps are explainable
    required: false
    default: ''
  timings-file:
    description: >-
      Measured wall seconds per top-level benchmark, stored as shard-timings.txt
      next to the data for the shard planner. Empty skips it.
    required: false
    default: ''
  sync-page:
    description: Copy the shared page; storage's matrix legs publish data only
    required: false
    default: 'true'
  token:
    description: Token used to push to the gh-pages branch
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Checkout gh-pages
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: gh-pages
        path: .benchmark-pages-sync
        token: ${{ inputs.token }}

    - name: Publish Data And Sync Page
      shell: bash
      env:
        DATA_DIR: ${{ inputs.data-dir }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        MAX_ITEMS: ${{ inputs.max-items }}
        FORCE_PACKAGE_SUFFIX: ${{ inputs.go-force-package-suffix }}
        CPU_MODEL: ${{ inputs.cpu-model }}
        TIMINGS_FILE: ${{ inputs.timings-file }}
        SYNC_PAGE: ${{ inputs.sync-page }}
      run: bash "${{ github.action_path }}/sync.sh" .benchmark-pages-sync