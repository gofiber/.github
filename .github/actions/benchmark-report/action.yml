name: benchmark-report
description: >-
  Turns a raw `go test -bench` output file into the alert comparison, the stored
  baseline and the gh-pages publish. Split out of the benchmark workflow so the
  single-job run and the merged sharded run go through identical logic.

inputs:
  output-file:
    description: Raw benchmark output to process
    required: false
    default: output.txt
  cpu-model:
    description: >-
      CPU the benchmarks actually ran on. Sharded runs pass the model reported by
      the shards; left empty the action reads the CPU of the runner it runs on.
    required: false
    default: ''
  filter-parallel:
    description: Drop results whose benchmark name contains Parallel before processing
    required: false
    default: 'false'
  alert-min-ns:
    description: Drop benchmarks faster than this many ns/op from the alert comparison
    required: false
    default: '1'
  alert-threshold:
    description: Regression threshold at which an alert is raised
    required: false
    default: '150%'
  improve-threshold:
    description: >-
      Improvement from which a result is worth reporting back. Empty mirrors
      alert-threshold, so both directions carry the same amount of noise.
    required: false
    default: ''
  go-force-package-suffix:
    description: Always append the Go package to the benchmark names
    required: false
    default: 'false'
  max-items-in-chart:
    description: Number of runs kept in the gh-pages data.js
    required: true
  benchmark-data-dir-path:
    description: Directory on the gh-pages branch where the benchmark data is stored
    required: false
    default: benchmarks
  pages-cpu-model:
    description: Publish to gh-pages only when the runner CPU contains this string
    required: false
    default: ''
  working-directory:
    description: Module directory the benchmarks belong to, used in the cache key
    required: false
    default: '.'
  sync-pages:
    description: Sync the shared benchmark page to gh-pages after publishing
    required: false
    default: 'true'
  github-token:
    description: Token used for comments, cache and the gh-pages push
    required: true

runs:
  using: composite
  steps:
    - name: Remove Parallel Benchmarks
      if: inputs.filter-parallel == 'true'
      shell: bash
      env:
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        # Match Parallel anywhere, not just after an underscore: sub-benchmarks
        # spell it WithProxyCheckParallelMultipleSubnet and slipped through.
        awk '!/^Benchmark.*Parallel/' "$OUTPUT_FILE" > output_filtered.txt
        mv output_filtered.txt "$OUTPUT_FILE"

    # NOTE: Benchmarks could change with different CPU types
    - name: Check Runner CPU
      id: cpu
      shell: bash
      env:
        WANTED_CPU: ${{ inputs.pages-cpu-model }}
        GIVEN_CPU: ${{ inputs.cpu-model }}
      run: |
        set -euo pipefail
        # A merged sharded run is reported from a job that did not benchmark anything,
        # so the model is handed in; otherwise read the runner we are sitting on.
        if [[ -n "${GIVEN_CPU}" ]]; then
          CPU_MODEL="${GIVEN_CPU}"
        else
          CPU_MODEL="$(lscpu | awk -F': *' '/^Model name/ { print $2; exit }')"
        fi
        echo "model=${CPU_MODEL}" >> "$GITHUB_OUTPUT"
        echo "Benchmark CPU: ${CPU_MODEL}" >> "$GITHUB_STEP_SUMMARY"
        HAVE="$(printf '%s' "${CPU_MODEL}" | tr '[:upper:]' '[:lower:]')"
        WANT="$(printf '%s' "${WANTED_CPU}" | tr '[:upper:]' '[:lower:]')"
        if [[ -z "${WANT}" || "${HAVE}" == *"${WANT}"* ]]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "Publish skipped, gh-pages is pinned to '${WANTED_CPU}'." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::gh-pages publish skipped, runner CPU '${CPU_MODEL}' is not the pinned '${WANTED_CPU}'"
        fi
        # A baseline only lines up per benchmark when both sides saw the same CPU.
        # Shard models are joined with '+', so a '+' means this run alone already
        # spanned several, and which benchmark landed where is not reproducible.
        COMPARABLE=true
        if [[ "${CPU_MODEL}" == *+* ]]; then
          COMPARABLE=false
          echo "Comparison skipped, this run spanned multiple CPU models: ${CPU_MODEL}." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::benchmark comparison skipped, this run spanned multiple CPU models (${CPU_MODEL})"
        elif [[ -n "${WANT}" && "${HAVE}" != *"${WANT}"* ]]; then
          COMPARABLE=false
          echo "Comparison skipped, CPU '${CPU_MODEL}' is not the pinned '${WANTED_CPU}'." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::benchmark comparison skipped, runner CPU '${CPU_MODEL}' is not the pinned '${WANTED_CPU}'"
        fi
        echo "comparable=${COMPARABLE}" >> "$GITHUB_OUTPUT"

    - name: Get Default branch SHA
      id: base-sha
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        SHA="$(git ls-remote origin "${DEFAULT_BRANCH}" | awk 'NR==1 {print $1}')"
        if [[ -z "${SHA}" ]]; then
          echo "Failed to resolve SHA for default branch '${DEFAULT_BRANCH}'" >&2
          exit 1
        fi
        echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

    - name: Build Cache Key
      id: cache-key
      shell: bash
      env:
        CPU_MODEL: ${{ steps.cpu.outputs.model }}
        BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        SAFE_CPU_MODEL="$(printf '%s' "$CPU_MODEL" | tr -cs '[:alnum:]._-' '-')"
        SAFE_CPU_MODEL="${SAFE_CPU_MODEL#-}"
        SAFE_CPU_MODEL="${SAFE_CPU_MODEL%-}"
        WD_SLUG="$(printf '%s' "$WORKING_DIRECTORY" | tr -cs '[:alnum:]._-' '-')"
        # The SHA sits at the end so restore-keys can fall back to the newest
        # cache of the same OS/CPU/module when the exact SHA has no cache yet.
        # v2 caches hold the raw benchmark output, v1 held a github-action-benchmark JSON.
        echo "prefix=benchmark-v2-${{ runner.os }}-${SAFE_CPU_MODEL}-${WD_SLUG}-" >> "$GITHUB_OUTPUT"
        echo "key=benchmark-v2-${{ runner.os }}-${SAFE_CPU_MODEL}-${WD_SLUG}-${BASE_SHA}" >> "$GITHUB_OUTPUT"

    - name: Get Benchmark Results from Default branch
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./cache
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.prefix }}

    # What the PR already says decides whether this run has anything to add, so the
    # posted report is fetched before the comparison runs.
    - name: Find Posted Report
      id: posted
      # commenting is not what this job gates on, so an API hiccup here stays a
      # warning; posting is skipped for this run rather than guessing and duplicating
      continue-on-error: true
      if: >-
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true
        && steps.cpu.outputs.comparable == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        MARKER: <!-- benchmark-report:${{ inputs.working-directory }} -->
      run: |
        set -euo pipefail
        # id, is it this module's report, is it any module's report
        rows="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
          --jq ".[] | [.id, (.body | startswith(\"${MARKER}\") | tostring), (.body | startswith(\"<!-- benchmark-report:\") | tostring)] | @tsv")"
        id=""
        buried=false
        while IFS=$'\t' read -r comment mine report; do
          if [[ "$mine" == "true" ]]; then
            id="$comment"
            buried=false
          elif [[ -n "$id" && "$report" != "true" ]]; then
            # only foreign comments bury a report, the sibling modules' ones do not
            buried=true
          fi
        done <<< "$rows"
        {
          echo "id=${id}"
          echo "buried=${buried}"
        } >> "$GITHUB_OUTPUT"
        if [[ -n "$id" ]]; then
          gh api "repos/${REPO}/issues/comments/${id}" --jq .body > previous.md
        fi

    - name: Compare With Baseline
      id: compare
      shell: bash
      env:
        ALERT_THRESHOLD: ${{ inputs.alert-threshold }}
        IMPROVE_THRESHOLD: ${{ inputs.improve-threshold }}
        ALERT_MIN_NS: ${{ inputs.alert-min-ns }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DATA_DIR: ${{ inputs.benchmark-data-dir-path }}
        CPU_MODEL: ${{ steps.cpu.outputs.model }}
        COMPARABLE: ${{ steps.cpu.outputs.comparable }}
        ACTION_PATH: ${{ github.action_path }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        # the head of the PR, not the merge commit nobody can look up
        COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [[ "${COMPARABLE}" != "true" ]]; then
          exit 0
        fi
        if [[ ! -f ./cache/baseline.txt ]]; then
          echo "No cached baseline for CPU '${CPU_MODEL}', comparison skipped." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # restore-keys can hand back an older cache than the current default branch head,
        # and a stale baseline is the usual reason a number looks off
        BASE_SHA="${MATCHED_KEY##*-}"
        if [[ "${#BASE_SHA}" -ne 40 ]]; then
          BASE_SHA=""
        fi
        # The published history carries every benchmark's own noise band; a
        # same-machine retest cannot see cross-machine wobble, this can.
        if ! curl -fsSL --max-time 10 "${REPO_URL}/raw/gh-pages/${DATA_DIR}/data.js" -o history.js 2> /dev/null; then
          : > history.js
        fi
        compare() {
          python3 "${ACTION_PATH}/compare.py" \
            --base ./cache/baseline.txt \
            --current "$OUTPUT_FILE" \
            --out report.md \
            --previous previous.md \
            --threshold "$ALERT_THRESHOLD" \
            --improve-threshold "$IMPROVE_THRESHOLD" \
            --min-ns "$ALERT_MIN_NS" \
            --commit "$COMMIT" \
            --baseline-ref "$DEFAULT_BRANCH" \
            --baseline-sha "$BASE_SHA" \
            --repo-url "$REPO_URL" \
            --run-url "$RUN_URL" \
            --workdir "$WORKING_DIRECTORY" \
            --history history.js \
            --details retest-details.md \
            "$@"
        }
        status=0
        output="$(compare --retest-plan retest-plan.txt)" || status=$?
        printf '%s\n' "$output"
        # exit 1 means regressions, anything else means the script itself broke
        if [[ "$status" -gt 1 ]]; then
          exit "$status"
        fi
        # The pools are noisy enough that a single measurement crossing a threshold,
        # in either direction, or drifting from what the posted report says is as
        # likely wobble as change. Re-measure exactly those benchmarks (seconds, not
        # the quarter hour of the full suite) and believe only what reproduces. The
        # plan file is empty when there is nothing, or too much, to ask.
        if [[ -s retest-plan.txt ]]; then
          skip=""
          # The sharded report job carries no toolchain; fetch one only now that
          # something must be re-measured, so quiet runs never pay for setup-go.
          if ! command -v go > /dev/null; then
            GO_VERSION="$(curl -fsSL --max-time 15 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')" || GO_VERSION=""
            ARCH="$(uname -m)"
            case "$ARCH" in aarch64) ARCH=arm64 ;; x86_64) ARCH=amd64 ;; esac
            if [[ -n "$GO_VERSION" ]] && curl -fsSL --max-time 120 \
                "https://go.dev/dl/${GO_VERSION}.linux-${ARCH}.tar.gz" | tar -xz -C "${RUNNER_TEMP:-/tmp}"; then
              export PATH="${RUNNER_TEMP:-/tmp}/go/bin:$PATH"
            fi
          fi
          if ! command -v go > /dev/null; then
            skip="no Go toolchain and none could be fetched"
          else
            # same derivation as the workflow's Describe step; on another machine the
            # re-measurement would prove nothing
            model="$(lscpu | awk -F': *' '/^Model name/ && !m { m = $2 } END { print m }')"
            if [[ -z "$model" ]]; then
              model="$(uname -m) $(awk -F': *' '/^CPU implementer|^CPU part/ { print $2 }' \
                /proc/cpuinfo | sort -u | tr '\n' ' ')"
            fi
            model="$(printf '%s' "$model" | sed 's/ *$//')"
            if [[ "${CPU_MODEL%% (GOMAXPROCS=*}" != "$model" ]]; then
              skip="this runner is a '${model}', the numbers came from '${CPU_MODEL}'"
            fi
          fi
          if [[ -n "$skip" ]]; then
            echo "::warning::regressions not re-measured: ${skip}"
          else
            procs="$(nproc)"
            if [[ "$CPU_MODEL" =~ \(GOMAXPROCS=([0-9]+)\) ]]; then
              procs="${BASH_REMATCH[1]}"
            fi
            regex="$(head -n 1 retest-plan.txt)"
            echo "Re-measuring the flagged benchmarks"
            ok=true
            : > "$GITHUB_WORKSPACE/retest.txt"
            : > "$GITHUB_WORKSPACE/retest.log"
            # one plan line per module directory; -count=3 so the median decides,
            # not whichever way the single re-measurement happens to wobble
            while IFS=$'\t' read -r dir pkg_list; do
              # shellcheck disable=SC2086 # the package list is intentionally word-split
              (cd "${WORKING_DIRECTORY}/${dir}" && GOMAXPROCS="$procs" \
                go test -run '^$' -bench "$regex" -benchmem -count=3 -timeout 15m $pkg_list) \
                >> "$GITHUB_WORKSPACE/retest.txt" 2>> "$GITHUB_WORKSPACE/retest.log" || ok=false
            done < <(tail -n +2 retest-plan.txt)
            if [[ "$ok" == "true" ]]; then
              status=0
              output="$(compare --retested retest.txt --save-verified verified.txt)" || status=$?
              printf '%s\n' "$output"
              if [[ "$status" -gt 1 ]]; then
                exit "$status"
              fi
            else
              echo "::warning::re-measuring failed, keeping the first measurement"
              cat retest.log
            fi
          fi
        fi
        cat report.md >> "$GITHUB_STEP_SUMMARY"
        if [[ -f retest-details.md ]]; then
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat retest-details.md >> "$GITHUB_STEP_SUMMARY"
        fi
        printf '%s\ncompared=true\n' "$output" >> "$GITHUB_OUTPUT"

    # Comment rules in full: see README.md next to this file. Short version: refresh
    # in place only while the report is the last comment, post a new one once it is
    # buried and the findings changed, and hide whatever gets superseded.
    - name: Post Benchmark Report
      continue-on-error: true
      if: >-
        steps.compare.outputs.compared == 'true'
        && steps.posted.outcome != 'failure'
        && github.event.pull_request.head.repo.fork != true
        && (github.event_name == 'pull_request' || steps.compare.outputs.regressed == 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.sha }}
        SIGNIFICANT: ${{ steps.compare.outputs.significant }}
        CHANGED: ${{ steps.compare.outputs.changed }}
        POSTED: ${{ steps.posted.outputs.id }}
        BURIED: ${{ steps.posted.outputs.buried }}
        # per module, so the matrix legs of a multi-package repo do not overwrite each other
        MARKER: <!-- benchmark-report:${{ inputs.working-directory }} -->
      run: |
        set -euo pipefail
        { printf '%s\n\n' "$MARKER"; cat report.md; } > comment.md
        if [[ -z "$PR" ]]; then
          gh api -X POST "repos/${REPO}/commits/${SHA}/comments" -F body=@comment.md > /dev/null
          exit 0
        fi
        if [[ -z "$POSTED" ]]; then
          if [[ "$SIGNIFICANT" == "true" ]]; then
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi
          exit 0
        fi
        # the posted report already says "nothing to see here" and still holds
        if [[ "$CHANGED" != "true" && "$SIGNIFICANT" != "true" ]]; then
          exit 0
        fi
        # editing sends no notification, so the numbers stay current for free, but
        # only while the report is still the last word in the thread
        if [[ "$BURIED" != "true" ]]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${POSTED}" -F body=@comment.md > /dev/null
          exit 0
        fi
        # a buried report is what the thread below it replied to: never rewritten,
        # only superseded by a new comment once the findings moved
        if [[ "$CHANGED" != "true" ]]; then
          exit 0
        fi
        gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md > /dev/null
        # the superseded report is hidden, not rewritten: its body (and marker) stay
        # intact, GitHub folds it away and labels it outdated
        node="$(gh api "repos/${REPO}/issues/comments/${POSTED}" --jq .node_id)"
        gh api graphql \
          -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
          -f id="$node" > /dev/null

    - name: Fail On Regression
      if: steps.compare.outputs.regressed == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "::error::benchmark regressions detected, see the job summary for the table"
        exit 1

    - name: Store Benchmark Results for Default branch
      if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.cpu.outputs.comparable == 'true'
      shell: bash
      env:
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail
        mkdir -p ./cache
        # prefer the verified values when this run re-measured its own deviations,
        # so a one-off spike does not become the baseline every PR is judged against
        if [[ -f verified.txt ]]; then
          cp verified.txt ./cache/baseline.txt
        else
          cp "$OUTPUT_FILE" ./cache/baseline.txt
        fi

    - name: Update Benchmark Results cache
      if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.cpu.outputs.comparable == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./cache
        key: ${{ steps.cache-key.outputs.key }}

    # Data publish and page sync in one commit. The data lands in the columnar
    # v2 data.js; github-action-benchmark is gone (its per-run format had grown
    # fiber's data.js to 85 MB, a third of GitHub's hard file limit).
    - name: Publish Benchmark Results to GitHub Pages
      if: >-
        github.event_name != 'pull_request'
        && github.ref_name == github.event.repository.default_branch
        && (steps.cpu.outputs.publish == 'true' || inputs.sync-pages == 'true')
      uses: gofiber/.github/.github/actions/benchmark-pages@main
      with:
        data-dir: ${{ inputs.benchmark-data-dir-path }}
        # empty when this runner's CPU is not the pinned one: page sync only
        output-file: ${{ steps.cpu.outputs.publish == 'true' && inputs.output-file || '' }}
        max-items: ${{ inputs.max-items-in-chart }}
        go-force-package-suffix: ${{ inputs.go-force-package-suffix }}
        cpu-model: ${{ steps.cpu.outputs.model }}
        sync-page: ${{ inputs.sync-pages }}
        token: ${{ inputs.github-token }}
