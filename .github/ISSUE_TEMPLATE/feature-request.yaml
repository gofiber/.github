name: "\U0001F680 Feature Request"
title: "\U0001F680 [Feature]: "
description: Suggest an idea to improve this project.
labels: ["✏️ Feature"]

body:
  - type: markdown
    attributes:
      value: |
        ### Notice
        - A feature for Fiber itself belongs in [gofiber/fiber](https://github.com/gofiber/fiber/issues/new/choose).
        - Don't forget you can ask your questions in our [Discord server](https://gofiber.io/discord).
        - If you think this is just a bug, open the issue with the **🐛 Bug Report** template.
        - Write your issue with clear and understandable English.
  - type: textarea
    id: description
    attributes:
      label: "Feature Description"
      description: "A clear and detailed description of the feature you would like to see, and the problem it solves."
      placeholder: "Explain your feature clearly and in detail."
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context (optional)"
      description: "Alternatives you have considered, links to related issues, or anything else that helps."
      placeholder: "Write here what else we should know."
  - type: textarea
    id: snippet
    attributes:
      label: "Code Snippet (optional)"
      description: "A code snippet may be really helpful to describe the feature."
      placeholder: "Share a code snippet that shows how the feature would be used."
      render: go
      value: |
        package main

        func main() {
          // How the feature would be used
        }
  - type: checkboxes
    id: terms
    attributes:
      label: "Checklist:"
      description: "By submitting this issue, you confirm that:"
      options:
        - label: "I agree to follow the gofiber [Code of Conduct](https://github.com/gofiber/.github/blob/main/CODE_OF_CONDUCT.md)."
          required: true
        - label: "I have checked for existing issues that describe my suggestion prior to opening this one."
          required: true
        - label: "I understand that improperly formatted feature requests may be closed without explanation."
          required: true
