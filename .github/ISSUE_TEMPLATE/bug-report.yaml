name: "\U0001F41B Bug Report"
title: "\U0001F41B [Bug]: "
description: Create a bug report to help us fix it.
labels: ["☢️ Bug"]

body:
  - type: markdown
    attributes:
      value: |
        ### Notice
        - **Security problem?** Do not open an issue. Report it privately with **Report a vulnerability** in the **Security** tab of this repository, as described in the [security policy](https://github.com/gofiber/.github/blob/main/SECURITY.md).
        - A problem in Fiber itself belongs in [gofiber/fiber](https://github.com/gofiber/fiber/issues/new/choose), a problem in a third-party module in that module's repository.
        - Don't forget you can ask your questions in our [Discord server](https://gofiber.io/discord).
        - If you want to suggest something new, open the issue with the **🚀 Feature Request** template.
        - Write your issue with clear and understandable English.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and detailed description of what the bug is."
      placeholder: "Explain your problem clearly and in detail."
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to Reproduce
      description: "Steps to reproduce the behavior and what should be observed in the end."
      placeholder: "Tell us step by step how we can replicate your problem and what we should see in the end."
      value: |
          Steps to reproduce the behavior:
          1. Go to '....'
          2. Click on '....'
          3. Do '....'
          4. See '....'
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "A clear and detailed description of what you think should happen."
      placeholder: "Tell us what should normally happen."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Module and Version"
      description: "Write `n/a` if this repository has no releases (for example awesome-fiber, benchmarks or recipes). Otherwise name the module, package or tool and its exact version; in repositories with several modules (contrib, storage, template), name the module. `go list -m all | grep gofiber` lists the versions in your project."
      placeholder: "github.com/gofiber/storage/redis/v3 v3.6.3"
    validations:
      required: true
  - type: input
    id: fiber-version
    attributes:
      label: "Fiber Version (optional)"
      description: "The Fiber version you use together with it, if any."
      placeholder: "v3.6.1"
  - type: textarea
    id: environment
    attributes:
      label: "Environment (optional)"
      description: "Go version (`go version`), operating system and architecture, and anything else that may matter."
      placeholder: "go1.26.0 linux/amd64"
  - type: textarea
    id: snippet
    attributes:
      label: "Code Snippet (optional)"
      description: "For some issues, we need to know some parts of your code. A minimal program that reproduces the problem helps most."
      placeholder: "Share a code snippet that you think is related to the issue."
      render: go
      value: |
        package main

        func main() {
          // Steps to reproduce
        }
  - type: checkboxes
    id: terms
    attributes:
      label: "Checklist:"
      description: "By submitting this issue, you confirm that:"
      options:
        - label: "I agree to follow the gofiber [Code of Conduct](https://github.com/gofiber/.github/blob/main/CODE_OF_CONDUCT.md)."
          required: true
        - label: "I have checked for existing issues that describe my problem prior to opening this one."
          required: true
        - label: "I understand that improperly formatted bug reports may be closed without explanation."
          required: true
